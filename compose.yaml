# HealthGuard laptop demo: PostgreSQL, Redis, migrations, the synthetic seed,
# the API, the background worker and the web app.
#
#   pnpm env:setup          # once: creates .env with fresh keys (or copy .env.example)
#   docker compose up --build
#
# Then open http://localhost:3000. Every `up` re-runs the seed, which resets
# the demo to scenario day 92. DEMO • SYNTHETIC HEALTH DATA • NOT FOR CLINICAL USE
name: healthguard

x-database-url: &database-url postgresql://${POSTGRES_USER:-healthguard}:${POSTGRES_PASSWORD:-healthguard}@postgres:5432/${POSTGRES_DB:-healthguard}

x-build: &build
  context: .
  dockerfile: infrastructure/docker/Dockerfile

x-api-environment: &api-environment
  NODE_ENV: production
  DEMO_MODE: 'true'
  # This stack is a demo, so demo mode is allowed with production builds.
  ALLOW_DEMO_IN_PRODUCTION: 'true'
  DATABASE_URL: *database-url
  REDIS_URL: redis://redis:6379
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  # The web container forwards browser requests; trust private-network proxies only.
  TRUST_PROXY: 'true'
  LOG_PRETTY: 'false'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthguard}
      POSTGRES_DB: ${POSTGRES_DB:-healthguard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # Cache, rate limits and queues only: nothing here needs to survive a restart.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      <<: *build
      target: tools
    command: ['pnpm', 'db:migrate']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    build:
      <<: *build
      target: tools
    command: ['pnpm', 'db:seed']
    environment:
      DATABASE_URL: *database-url
      DEMO_MODE: 'true'
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-HealthGuard-Demo-2026}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    build:
      <<: *build
      target: api
    env_file:
      - path: .env
        required: false
    environment: *api-environment
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      <<: *build
      target: api
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    env_file:
      - path: .env
        required: false
    environment: *api-environment
    # The worker serves no HTTP, so the image's HTTP health check does not apply.
    healthcheck:
      disable: true
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      <<: *build
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
